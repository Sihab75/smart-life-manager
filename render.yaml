services:
  - type: web
    name: smart-life-manager-ai
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: PHONE_LOOKUP_HMAC_SECRET
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: PUBLIC_FIREBASE_API_KEY
        sync: false
      - key: PUBLIC_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: PUBLIC_FIREBASE_APP_ID
        sync: false
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
